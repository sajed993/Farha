<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="حلم">
  <!-- A nib writes a line of rose ink on a card that is sliding into an open
       envelope; the envelope keeps the small rose wax seal of the first mark.
       Palette: cream paper, gold nib and edges, rose ink and wax, bronze barrel. -->
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4E6C6"/><stop offset=".45" stop-color="#C9A24B"/><stop offset="1" stop-color="#9A742C"/>
    </linearGradient>
    <linearGradient id="wax" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#813F49"/><stop offset=".5" stop-color="#AA606A"/><stop offset="1" stop-color="#8E4852"/>
    </linearGradient>
    <linearGradient id="barrel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5E3A1C"/><stop offset=".45" stop-color="#8A5A2E"/><stop offset="1" stop-color="#4A2C14"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFDF7"/><stop offset="1" stop-color="#F6ECD8"/>
    </linearGradient>
    <linearGradient id="flap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F3E5C9"/><stop offset="1" stop-color="#E9D8B4"/>
    </linearGradient>
  </defs>

  <!-- open flap, behind everything -->
  <path d="M14 66 L60 32 L106 66 Z" fill="url(#flap)" stroke="url(#gold)" stroke-width="1.6" stroke-linejoin="round"/>

  <!-- the card, half inside -->
  <g transform="rotate(-6 60 70)">
    <rect x="28" y="44" width="64" height="50" rx="2.5" fill="url(#paper)" stroke="url(#gold)" stroke-width="1.3"/>
    <!-- the line being written -->
    <path d="M38 64 C44 56 50 72 56 64 S66 56 72 64 S80 68 84 62" fill="none" stroke="#AA606A" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M40 76 H70" fill="none" stroke="#C9A24B" stroke-width="1.2" stroke-linecap="round" opacity=".7"/>
  </g>

  <!-- envelope pocket, in front of the card -->
  <path d="M14 66 L14 106 Q14 110 18 110 L102 110 Q106 110 106 106 L106 66 L60 96 Z" fill="url(#paper)" stroke="url(#gold)" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M14 106 L48 86 M106 106 L72 86" fill="none" stroke="url(#gold)" stroke-width="1.2" opacity=".8"/>

  <!-- the wax dot where the flap will seal -->
  <circle cx="60" cy="96" r="6.2" fill="url(#wax)"/>
  <circle cx="60" cy="96" r="6.2" fill="none" stroke="url(#gold)" stroke-width="1"/>
  <circle cx="58.2" cy="94.2" r="1.6" fill="#fff" opacity=".35"/>

  <!-- the pen: tip on the card, leaning to the right -->
  <g transform="rotate(38 74 60)">
    <!-- nib -->
    <path d="M74 60 L66.5 40 Q74 31 81.5 40 Z" fill="url(#gold)" stroke="#9A742C" stroke-width=".8" stroke-linejoin="round"/>
    <path d="M74 60 L74 44" stroke="#8A5A2E" stroke-width="1" stroke-linecap="round"/>
    <circle cx="74" cy="43" r="2" fill="#FFFBF3" stroke="#9A742C" stroke-width=".7"/>
    <!-- grip ring and barrel -->
    <rect x="67.5" y="27" width="13" height="7" rx="1.5" fill="url(#gold)"/>
    <rect x="68.5" y="2" width="11" height="26" rx="4" fill="url(#barrel)"/>
    <rect x="70.5" y="4" width="2.2" height="20" rx="1" fill="#fff" opacity=".18"/>
  </g>
</svg>
