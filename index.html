<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark light">
<!-- The theme is stamped on <html> here, before the stylesheet is even
     requested, because doing it from a script at the bottom of the page means
     a full cream flash on every load — worse on a slow phone, which is most
     of them. Dark is the default; only an explicit choice moves it. -->
<script>
(function(){var t,d;
 try{t=localStorage.getItem('farha-theme');d=localStorage.getItem('farha-theme-def');}catch(e){}
 if(t!=='light'&&t!=='dark'){          /* no choice of their own: the shop's default */
  t=(d==='system')
    ? (window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches?'light':'dark')
    : (d==='light'?'light':'dark');}
 document.documentElement.setAttribute('data-theme',t);})();
</script>

<script>
/* GSAP and its two plugins are 100 KB used by exactly one file — the luxe
   invitation — which only runs when someone taps an invitation open. They were
   blocking the landing page for a screen nobody had reached yet. Fetched once
   the page is quiet instead; the invitation already checks for window.gsap and
   simply animates less if it is not there yet. */
(function(){
 var V=['/js/vendor/gsap.min.js','/js/vendor/SplitText.min.js','/js/vendor/DrawSVGPlugin.min.js'];
 function next(i){ if(i>=V.length)return;
  var s=document.createElement('script'); s.src=V[i]; s.async=false;
  s.onload=s.onerror=function(){next(i+1)};
  document.body.appendChild(s); }
 var go=function(){ next(0); };
 if('requestIdleCallback' in window) requestIdleCallback(go,{timeout:3000});
 else setTimeout(go,1200);
})();
</script>
